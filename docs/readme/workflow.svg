ad" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M880 257 L910 257" fill="none" stroke="#a4b9ad" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="56" y="424" width="1168" height="58" rx="18" fill="#203b3a"/><text x="82" y="460" fill="#cfe4d9" font-family="SimHei, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16px" font-weight="700" text-anchor="start">正常任务</text><text x="208" y="460" fill="#f6f1e5" font-family="SimHei, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16px" font-weight="400" text-anchor="start">说需求  →  按方案修改  →  到收尾时按流程检查  →  记录结果 / 按需发布</text></svg>